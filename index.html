<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>小妲的审判小游戏</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      color: #f0e6d0;
      position: fixed;
      inset: 0;
    }

    /* ========== 通用屏幕 ========== */
    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.55s ease, visibility 0.55s ease;
      z-index: 1;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    /* ========== 开始界面 ========== */
    #start-screen {
      background: #000;
      cursor: pointer;
    }

    #start-screen .video-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #start-screen video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      /* 禁止默认控件与手势 */
      pointer-events: none;
    }

    /* 全屏点击热区（盖在视频上面，确保能点到） */
    #start-click-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      cursor: pointer;
      background: transparent;
    }

    .start-overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.5) 0%,
        rgba(0, 0, 0, 0.1) 30%,
        rgba(0, 0, 0, 0.2) 60%,
        rgba(0, 0, 0, 0.78) 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: max(12vh, 80px);
      pointer-events: none; /* 文字不挡点击，点击由 #start-click-layer 接收 */
    }

    .game-title {
      font-size: clamp(26px, 6.5vw, 40px);
      font-weight: 700;
      color: #f0c040;
      text-shadow:
        0 0 20px rgba(201, 162, 39, 0.75),
        0 0 40px rgba(196, 30, 58, 0.45),
        0 2px 6px rgba(0, 0, 0, 0.9);
      letter-spacing: 3px;
      margin-bottom: 16px;
      text-align: center;
      animation: titlePulse 3s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(201,162,39,0.75), 0 0 40px rgba(196,30,58,0.45), 0 2px 6px rgba(0,0,0,0.9); }
      50% { opacity: 0.95; text-shadow: 0 0 30px rgba(240,192,64,0.95), 0 0 55px rgba(196,30,58,0.6), 0 2px 6px rgba(0,0,0,0.9); }
    }

    .start-hint {
      font-size: clamp(13px, 3.2vw, 17px);
      color: #e8d090;
      letter-spacing: 2px;
      animation: hintBlink 1.8s ease-in-out infinite;
    }

    @keyframes hintBlink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }

    /* ========== 主游戏界面 ========== */
    #main-screen {
      background: #080606;
      display: flex;
      flex-direction: column;
    }

    .char-area {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #0a0606;
    }

    .char-area video,
    .char-area img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
    }

    .char-area .idle-img {
      opacity: 0;
      transition: opacity 0.22s ease;
      z-index: 2;
      pointer-events: none;
    }

    .char-area.idle .idle-img {
      opacity: 1;
    }

    .char-area.idle video {
      opacity: 0;
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: linear-gradient(180deg, rgba(28,12,12,0.92) 0%, rgba(16,6,6,0.85) 100%);
      border-bottom: 1px solid rgba(100,30,30,0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
      backdrop-filter: blur(6px);
    }

    .top-bar .title-mini {
      font-size: 14px;
      color: #c9a227;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .lang-btns {
      display: flex;
      gap: 6px;
    }

    .lang-btn {
      min-width: 48px;
      height: 28px;
      padding: 0 10px;
      background: linear-gradient(180deg, #1f1810 0%, #120e08 100%);
      border: 1px solid #c9a227;
      border-radius: 3px;
      color: #e8d090;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover,
    .lang-btn.active {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow: 0 0 10px rgba(201,162,39,0.4);
    }

    .bottom-panel {
      position: relative;
      background: linear-gradient(160deg, rgba(32,12,12,0.97) 0%, rgba(14,5,5,0.99) 100%);
      border-top: 1px solid rgba(110,30,30,0.45);
      padding: 14px 16px 18px;
      z-index: 20;
    }

    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      height: 14px;
      margin-bottom: 10px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #8b1a1a 20%, #c41e3a 50%, #8b1a1a 80%, transparent 100%);
      box-shadow: 0 0 6px rgba(196,30,58,0.45);
    }

    .divider-diamond {
      width: 10px;
      height: 10px;
      margin: 0 6px;
      background: linear-gradient(135deg, #e8c040, #c9a227);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(201,162,39,0.6);
      border: 1px solid #f5d060;
    }

    .dialogue-box {
      min-height: 64px;
      margin-bottom: 12px;
    }

    .dialogue-quote {
      font-size: 15px;
      line-height: 1.65;
      color: #e05070;
      text-shadow: 0 0 10px rgba(224,80,112,0.35);
      margin-bottom: 4px;
    }

    .dialogue-name {
      font-size: 13px;
      color: #e8c040;
      font-weight: 500;
    }

    .action-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .game-btn {
      flex: 1;
      min-width: 90px;
      height: 40px;
      padding: 0 12px;
      background: linear-gradient(180deg, #1f1810 0%, #120e08 100%);
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #e8d090;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .game-btn:hover,
    .game-btn:active {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow: 0 0 14px rgba(201,162,39,0.45);
    }

    .game-btn.danger {
      border-color: #a03030;
      color: #e09090;
    }

    .game-btn.danger:hover {
      border-color: #c41e3a;
      color: #ffb0b0;
      box-shadow: 0 0 14px rgba(196,30,58,0.4);
    }

    .state-toggle {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 30;
      font-size: 11px;
      color: #706050;
      background: rgba(0,0,0,0.55);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(100,60,40,0.4);
    }
  </style>
</head>
<body>

  <!-- ========== 开始界面 ========== -->
  <div id="start-screen" class="screen active">
    <div class="video-wrap">
      <!-- 使用本地无缝循环版本；如需在线可改回 catbox 链接 -->
      <video
        id="cover-video"
        src="cover_loop.mp4"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
      ></video>
    </div>

    <!-- 透明全屏点击层：保证一定能点到 -->
    <div id="start-click-layer"></div>

    <div class="start-overlay">
      <h1 class="game-title">小妲的审判小游戏</h1>
      <p class="start-hint">▼ 点击画面开始</p>
    </div>
  </div>

  <!-- ========== 主游戏界面 ========== -->
  <div id="main-screen" class="screen">
    <div class="char-area" id="char-area">
      <video
        id="talk-video"
        src="main.mp4"
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
      ></video>
      <img class="idle-img" id="idle-img" src="main-idle.jpg" alt="">

      <div class="top-bar">
        <span class="title-mini">小妲的审判</span>
        <div class="lang-btns">
          <button class="lang-btn active" type="button">中文</button>
          <button class="lang-btn" type="button">EN</button>
        </div>
      </div>

      <div class="state-toggle" id="state-toggle">切换：讲话 / 闭嘴</div>
    </div>

    <div class="bottom-panel">
      <div class="divider"><div class="divider-diamond"></div></div>
      <div class="dialogue-box">
        <div class="dialogue-quote" id="dialogue-text">「终于来了，我的苦工预备役。」</div>
        <div class="dialogue-name">小妲大人</div>
      </div>
      <div class="action-btns">
        <button class="game-btn" id="btn-talk" type="button">继续听训</button>
        <button class="game-btn" id="btn-idle" type="button">低头认错</button>
        <button class="game-btn danger" id="btn-pay" type="button">上贡求饶</button>
      </div>
    </div>
  </div>

  <script>
    const startScreen   = document.getElementById('start-screen');
    const mainScreen    = document.getElementById('main-screen');
    const coverVideo    = document.getElementById('cover-video');
    const talkVideo     = document.getElementById('talk-video');
    const charArea      = document.getElementById('char-area');
    const stateToggle   = document.getElementById('state-toggle');
    const dialogueText  = document.getElementById('dialogue-text');
    const clickLayer    = document.getElementById('start-click-layer');

    // ---------- 封面视频：强制无缝循环 ----------
    function startCoverLoop() {
      coverVideo.muted = true;
      coverVideo.playsInline = true;

      // 原生 loop 有时在结尾会卡一下，用 timeupdate 提前重启更丝滑
      coverVideo.addEventListener('timeupdate', function onTime() {
        // 在结束前约 0.08 秒跳回开头，减少可见跳变
        if (coverVideo.duration && coverVideo.currentTime >= coverVideo.duration - 0.08) {
          coverVideo.currentTime = 0.01;
        }
      });

      coverVideo.addEventListener('ended', () => {
        coverVideo.currentTime = 0;
        coverVideo.play().catch(() => {});
      });

      const tryPlay = () => {
        const p = coverVideo.play();
        if (p && p.catch) p.catch(() => {
          // 自动播放被拦时，等用户第一次触摸再播
          document.body.addEventListener('touchstart', () => coverVideo.play().catch(()=>{}), { once: true });
          document.body.addEventListener('click', () => coverVideo.play().catch(()=>{}), { once: true });
        });
      };

      if (coverVideo.readyState >= 2) tryPlay();
      else coverVideo.addEventListener('loadeddata', tryPlay, { once: true });
    }

    startCoverLoop();

    // 页面重新可见时恢复播放
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && startScreen.classList.contains('active')) {
        coverVideo.play().catch(() => {});
      }
    });

    // ---------- 请求全屏 ----------
    function requestFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || el.mozRequestFullScreen;
      if (req) {
        try { req.call(el); } catch (e) {}
      }
      // iOS 不支持标准全屏，用 meta + 固定定位已经尽量铺满
    }

    // ---------- 进入主界面 ----------
    let entered = false;
    function enterGame() {
      if (entered) return;
      entered = true;

      requestFullscreen();

      startScreen.classList.remove('active');
      mainScreen.classList.add('active');

      // 停止封面
      coverVideo.pause();

      // 默认进入讲话状态
      setTimeout(() => setTalking(true), 100);
    }

    // 点击 / 触摸 都能进
    clickLayer.addEventListener('click', enterGame);
    clickLayer.addEventListener('touchend', (e) => {
      e.preventDefault();
      enterGame();
    }, { passive: false });

    // 也监听整个 start-screen 兜底
    startScreen.addEventListener('click', enterGame);

    // ---------- 讲话 / 闭嘴 ----------
    let isTalking = true;

    function setTalking(talk) {
      isTalking = talk;
      if (talk) {
        charArea.classList.remove('idle');
        talkVideo.currentTime = 0;
        talkVideo.play().catch(() => {});
        stateToggle.textContent = '当前：讲话中（点此切换闭嘴）';
      } else {
        charArea.classList.add('idle');
        talkVideo.pause();
        stateToggle.textContent = '当前：闭嘴中（点此切换讲话）';
      }
    }

    stateToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      setTalking(!isTalking);
    });

    const lines = [
      { text: '「终于来了，我的苦工预备役。」', talk: true },
      { text: '「今天又想用什么借口逃过审判？」', talk: true },
      { text: '「……抬头看着我。」', talk: true },
      { text: '「跪下。」', talk: true },
      { text: '（小妲冷冷地盯着你，一言不发）', talk: false },
    ];
    let lineIndex = 0;

    document.getElementById('btn-talk').addEventListener('click', () => {
      lineIndex = (lineIndex + 1) % lines.length;
      dialogueText.textContent = lines[lineIndex].text;
      setTalking(lines[lineIndex].talk);
    });

    document.getElementById('btn-idle').addEventListener('click', () => {
      dialogueText.textContent = '（你低下了头，不敢直视她的眼睛）';
      setTalking(false);
    });

    document.getElementById('btn-pay').addEventListener('click', () => {
      dialogueText.textContent = '「哼，知道求饶就好。拿上贡来。」';
      setTalking(true);
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
